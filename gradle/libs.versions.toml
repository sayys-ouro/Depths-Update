# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
blossom = "2.2.0"
idea-ext = "1.4.1"
jspecify = "1.0.0"
junit = "6.1.3"
shadow = "9.6.1"

cleanroom = "0.6.13-alpha"
mcp-channel = "stable"
mcp-version = "39-1.12"
minecraft = "1.12.2"
sponge-mixin = "0.20.13+mixin.0.8.7"
unimined = "1.4.43-kappa"

assetmover = "2.5"
fluidloggedapi = "8445863"
fugue = "8878028"
nothirium = "7441674"
scalar = "8800375"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

sponge-mixin = { module = "com.cleanroommc:sponge-mixin", version.ref = "sponge-mixin" }

mod-assetmover = { module = "com.cleanroommc:assetmover", version.ref = "assetmover" }
mod-fluidlogged-api = { module = "curse.maven:fluidlogged-api-485654", version.ref = "fluidloggedapi" }
mod-fugue = { module = "curse.maven:fugue-1005815", version.ref = "fugue" }
mod-nothirium = { module = "curse.maven:nothirium-624960", version.ref = "nothirium" }
mod-scalar = { module = "curse.maven:scalar-1012168", version.ref = "scalar" }

[plugins]
blossom = { id = "net.kyori.blossom", version.ref = "blossom" }
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "idea-ext" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
unimined = { id = "xyz.wagyourtail.unimined", version.ref = "unimined" }
